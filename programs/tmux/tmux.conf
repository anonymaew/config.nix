# ─── General settings ──────────────────────────────────
set -g status-position top
set -g status-justify absolute-centre
set -g renumber-windows on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
setw -g mouse on

# ─── tmux >= 3.8 theme ──────────────────────────────────
# 3.8 added builtin light/dark themes: default styles now use theme colour
# names (themegreen, themeyellow, themelightgrey, ...) that resolve to tmux's
# own 256-colour picks (yellowgreen, darkgoldenrod, gray70) instead of the
# terminal palette. "terminal" is upstream's documented way to get the
# pre-3.8 colours back, so styles follow Ghostty's Catppuccin Mocha/Latte.
set -g theme terminal

# 3.8 also changed some defaults structurally, not just in hue, so they stay
# opaque (and greyed) even with `theme terminal`. Restore the pre-3.8 values so
# borders follow the text colour and unfilled areas, popups and tree mode stay
# see-through (Ghostty runs background-opacity 0.8, anything painted with a
# concrete bg colour is opaque).
set -g pane-border-style 'default'            # 3.8: fg=themelightgrey (greyed)
set -g fill-character ''                      # 3.8: bg=themedarkgrey block
set -g popup-style 'default'                  # 3.8: bg=themedarkgrey
set -g popup-border-style 'default'           # 3.8: bg=themedarkgrey
set -g tree-mode-border-style 'default'       # new in 3.8, same dark-grey box
set -g display-panes-border-style 'default'   # new in 3.8, same dark-grey box

set -g status-style 'bg=default'
setw -g window-status-style 'fg=color7'
setw -g window-status-format ' #I:#{?#{m:π*,#{pane_title}},π,#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{==:#{pane_current_command},nvim},#{s|.*\/||:#{s|nvim ||:#{pane_title}}},#{pane_current_command}}}} '
setw -g window-status-current-style 'fg=default bold'
setw -g window-status-current-format '[#I:#{?#{m:π*,#{pane_title}},π,#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{==:#{pane_current_command},nvim},#{s|.*\/||:#{s|nvim ||:#{pane_title}}},#{pane_current_command}}}}]'

set -g status-left '#S'

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c    "#{pane_current_path}"

# ─── Plugin: tmux-resurrect ────────────────────────────
set -g @resurrect-dir "$XDG_DATA_HOME/tmux/resurrect"
set -g @resurrect-processes 'btop k9s lazygit pi ssh'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-hook-post-save-all 'sed -i "" "s| --cmd .*-vim-pack-dir||g; s|/etc/profiles/per-user/$USER/bin/||g; s|/nix/store/.*/bin/||g" "$(readlink -f "$XDG_DATA_HOME/tmux/resurrect/last")"'
# Restore the exact pi session in each pane (pi-tmux-session-tracker): the pi
# extension records the session file in @pi-tmux-session-file and this hook
# rewrites the saved pane command to `pi --session '<file>'`. The package is
# declared in programs/pi/default.nix and cloned under pi's agent dir —
# $PI_CODING_AGENT_DIR, which programs/pi/default.nix moves off ~/.pi to
# $XDG_DATA_HOME/pi/agent. Single quotes, so the shell (not tmux) expands the
# fallbacks — a literal ~/.pi/agent path here just makes node exit 1 and the
# hook silently no-ops. Env-based rather than a Nix store path so this file
# still works when copied to a non-Nix machine.
set -g @resurrect-hook-post-save-layout 'node "${PI_CODING_AGENT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/pi/agent}/git/github.com/fabiangigler/pi-tmux-session-tracker/scripts/annotate-pi-sessions.ts"'

# ─── Plugin: tmux-continuum ────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ─── TPM (non‑Nix machines only) ──────────────────────
# On Nix machines,  @nix_tmux is set and plugins come from extraConfig.
# On non‑Nix machines, copy this file to ~/.config/tmux/tmux.conf (XDG);
# TPM downloads and loads the plugins.
if-shell '[ "$(tmux show-option -gv @nix_tmux 2>/dev/null)" != "1" ]' {
  # status-right set here so continuum prepends its save script to our format
  set -g status-right '#{user}@#h  %H:%M'

  set -g @plugin 'tmux-plugins/tpm'
  set -g @plugin 'tmux-plugins/tmux-resurrect'
  set -g @plugin 'tmux-plugins/tmux-continuum'
  run '~/.tmux/plugins/tpm/tpm'
}
