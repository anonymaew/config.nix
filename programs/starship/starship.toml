# starship — shell prompt
# See https://starship.rs/config/

continuation_prompt = "[>   ](grey)"
# $fill is what draws the divider: it pads to the terminal width, so inline is
# the only way to get a full-width rule. right_format cannot do this — since
# starship 1.27 the zsh init renders it as RPROMPT (`starship prompt --right`)
# and zsh aligns that itself, leaving the gap empty. It also drops an RPROMPT
# that does not fit, so a $fill inside right_format renders nothing at all.
format = "$env_var$username[@](green)$hostname:$directory$git_branch$git_status$fill$all$status$cmd_duration$line_break$character"

# ---- character --------------------------------------------------------------

[character]
error_symbol = '[\$](bold red)'
format = "$symbol "
success_symbol = '[\$](bold green)'

# ---- env_var ----------------------------------------------------------------

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = "green italic"

# ---- user & host ------------------------------------------------------------

[username]
disabled = false
format = "[$user]($style)"
show_always = true
style_root = "bold yellow"
style_user = "bold green"

[hostname]
disabled = false
format = "[$hostname]($style)"
ssh_only = false
style = "bold green"

# ---- directory --------------------------------------------------------------

[directory]
disabled = false
format = "[$path]($style)[$read_only]($read_only_style)"
style = "blue"
truncate_to_repo = false
truncation_length = 0

# ---- git --------------------------------------------------------------------

[git_branch]
format = " [$symbol $branch]($style)"
style = "bold yellow"
symbol = ""

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "yellow"

# package manager detected in the current dir — icon only, never the version
[package]
format = "[$symbol]($style)"

# ---- shell status -----------------------------------------------------------

# the divider. symbol:
#   "─"  a rule           "·"  light dots         plain space = invisible gap
# when the left side is longer than the terminal, fill shrinks to one symbol and
# everything after it is appended (see truncation_length under [directory])
[fill]
disabled = false
style = "bright-black"
symbol = "─"

[cmd_duration]
format = "[$duration](yellow) "

[status]
disabled = false
format = "[$status]($style) "

# ---- system -----------------------------------------------------------------

# no battery indicator (and no low-battery warning) in the prompt
[battery]
disabled = true

# ---- environments -----------------------------------------------------------

[direnv]
allowed_msg = ""
disabled = false
format = "[$symbol($loaded$allowed )]($style)"
loaded_msg = ""
not_allowed_msg = "!"
symbol = "󱁿 "
unloaded_msg = "?"

[nix_shell]
format = "[$symbol]($style)"
symbol = " "

# the only module allowed to print a version: major.minor, no "v", no patch
#
# This replaces starship's builtin [python] module (disabled below). The builtin
# runs the first python/python2/python3 found in PATH and ignores $VIRTUAL_ENV,
# .venv/ and .python-version, so under uv (no `source .venv/bin/activate`) PATH
# holds only /usr/bin/python3 and the prompt showed the machine's 3.9 instead of
# the project's 3.12. Verified on starship 1.27.0.
#
# Resolution, first match wins:
#   $VIRTUAL_ENV/bin/python          activated venv, or direnv `layout uv`
#   nearest .venv/bin/python         `uv sync` project, never activated
#   ./.python-version                pinned, venv not built yet (`3.12` or
#                                    uv's `cpython-3.12.9`; only digits survive)
#   first python3/python in PATH     machine default (honest fallback)
#
# `d=${d%/*}` empties out at the filesystem root, hence the `-n "$d"` guard: a
# `[ "$d" != / ]` test never fires there and spins until starship's timeout.
# No globs for the same class of reason — starship runs `when` through $SHELL,
# and `*.py` makes zsh abort with "no matches found" before the test runs.
[custom.python]
command = '''
p=$VIRTUAL_ENV/bin/python
d=$PWD
while [ ! -x "$p" ] && [ -n "$d" ]; do p=$d/.venv/bin/python; d=${d%/*}; done
if [ -x "$p" ]; then "$p" --version 2>&1 | cut -d" " -f2 | cut -d. -f1,2
elif [ -r .python-version ]; then head -n1 .python-version | tr -cd "0-9.\n" | cut -d. -f1,2
else p=$(command -v python3 || command -v python) && "$p" --version 2>&1 | cut -d" " -f2 | cut -d. -f1,2
fi
'''
when = '''
d=$PWD
while [ ! -d "$d/.venv" ] && [ -n "$d" ]; do d=${d%/*}; done
[ -n "$VIRTUAL_ENV" ] || [ -d "$d/.venv" ] || [ -r .python-version ] && exit 0
for f in Pipfile pyproject.toml requirements.txt setup.py tox.ini __init__.py; do [ -e "$f" ] && exit 0; done
exit 1
'''
format = "[$symbol $output]($style)"
symbol = "🐍"
style = "bold yellow"

# replaced by [custom.python] above — the builtin cannot see a venv it is not
# on PATH for, and PATH is right in exactly the case we are working around
[python]
disabled = true

[gcloud]
disabled = true

