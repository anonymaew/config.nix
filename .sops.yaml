      - &homelab_age age1xc8pv9d0tw4l0zn2yytksnejluck8nvtv325q8vk4aurvuqswvjs5ft63k # yamllint disable-line line-length
creation_rules:
      # Personal secrets (darwin, auth, go-bars, models) — age only, no shamir
      - path_regex: (darwin|auth|go-bars|models)\.(json|yaml)$
